<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Auto Face Attendance</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 20px; }
        .video-container { position: relative; width: 100%; max-width: 450px; margin: 0 auto; }
        video { width: 100%; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: block; }
        #status { font-size: 22px; font-weight: bold; margin-top: 20px; color: #2c3e50; min-height: 50px; }
        .success-box { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🏨 অটোমেটিক ফেস হাজিরা সিস্টেম</h2>
    <div class="video-container">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <div id="status">ক্যামেরা চালু হচ্ছে, সামনে এসে দাঁড়ান...</div>
    <div id="successBox" class="success-box"></div>

    <script>
        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        const successBox = document.getElementById('successBox');
        
        // আপনার গুগল শিটের ওয়েব অ্যাপ লিংকটি এখানে বসাবেন
        const WEB_APP_URL = "আপনার_ওয়েব_অ্যাপ_লিংক_এখানে_দিন";

        let isAttendanceMarked = false; // ডাবল এন্ট্রি আটকানোর জন্য

        // ক্যামেরা অন করা
        async function startVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                statusText.innerText = "ক্যামেরা প্রস্তুত। ক্যামেরার সামনে এসে দাঁড়ান...";
                statusText.style.color = "green";

                // ক্যামেরা চালু হওয়ার ৩ সেকেন্ড পর অটোমেটিক হাজিরা ট্রিগার হবে (ডেমো মোড - যা দিয়ে আপনার নাম অটো নিয়ে নেবে)
                startAutoDetection();

            } catch (err) {
                console.error("ক্যামেরা ত্রুটি: ", err);
                statusText.innerText = "ক্যামেরা পারমিশন পাওয়া যায়নি। ব্রাউজার সেটিংস থেকে Allow করুন।";
                statusText.style.color = "red";
            }
        }

        // ভয়েস এনাউন্সমেন্ট ফাংশন
        function speakMessage(message) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // আগের কথা বন্ধ করে নতুনটা বলবে
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.lang = 'bn-BD';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // অটো ফেস ডিটেকশন সিমুলেশন (সামনে দাঁড়ানোর সাথে সাথে কাজ করবে)
        function startAutoDetection() {
            // এখানে আপনি টেস্ট করার জন্য ৫ সেকেন্ড পর অটো হাজিরা নেওয়ার সিস্টেম রাখা হয়েছে
            // রিয়েল প্রজেক্টে ফেস কনফার্ম হওয়ার পর এই ফাংশন কল হবে
            setTimeout(() => {
                if (!isAttendanceMarked) {
                    triggerAttendance("STF-101", "সুরজিৎ মণ্ডল");
                }
            }, 4000); // ক্যামেরা চালুর ৪ সেকেন্ড পর অটো স্ক্যান করে নিয়ে নেবে
        }

        // গুগল শিটে ডেটা পাঠানো এবং ভয়েস ফিডব্যাক
        function triggerAttendance(staffId, staffName) {
            isAttendanceMarked = true;

            statusText.innerText = "মুখ স্ক্যান করা হয়েছে! হাজিরা রেকর্ড হচ্ছে...";
            statusText.style.color = "orange";

            const data = {
                staff_id: staffId,
                staff_name: staffName,
                status: "Present"
            };

            // গুগল শিটে পাঠানো (no-cors মোড যাতে ব্রাউজার ব্লক না করে)
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(() => {
                showSuccess(staffName);
            })
            .catch(() => {
                showSuccess(staffName);
            });
        }

        function showSuccess(name) {
            statusText.innerText = "হাজিরা সফল!";
            statusText.style.color = "green";

            successBox.style.display = "block";
            successBox.innerText = ${name}, আপনার হাজিরা সফল হলো, ধন্যবাদ!;

            // মুখে বলে দেওয়া
            speakMessage(${name}, আপনার হাজিরা সফল হলো, ধন্যবাদ।);

            // ১০ সেকেন্ড পর আবার নতুন হাজিরা নেওয়ার জন্য রিসেট হবে
            setTimeout(() => {
                successBox.style.display = "none";
                statusText.innerText = "পরবর্তী স্টাফের জন্য প্রস্তুত। সামনে এসে দাঁড়ান...";
                isAttendanceMarked = false;
            }, 10000);
        }

        startVideo();
    </script>
</body>
</html>
