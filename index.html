<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অটোমেটিক স্টাফ ফেস হাজিরা সিস্টেম</title>
    <!-- ফেস-এপিআই সিডিএন -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'SolaimanLipi', Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        video { width: 100%; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: block; margin: 0 auto; }
        #status { font-size: 20px; font-weight: bold; margin-top: 15px; color: #007bff; min-height: 60px; }
        .success { color: #28a745 !important; font-size: 22px; background: #e8f5e9; padding: 10px; border-radius: 8px; }
        .scanning { color: #e65100 !important; }
    </style>
</head>
<body>

    <div class="container">
        <h2>হোটেল স্টাফ অটোমেটিক ফেস হাজিরা</h2>
        <video id="video" autoplay muted playsinline></video>
        <div id="status">ক্যামেরা চালু করা হচ্ছে...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        const WEB_APP_URL = "আপনার_ওয়েব_অ্যাপ_লিংক_এখানে_দিন"; // গুগল শিটের ওয়েব অ্যাপ লিংক এখানে দেবেন
        
        let isModelLoaded = false;
        let faceMatcher = null;
        let isLocked = false; // হাজিরা নেওয়ার পর কিছুক্ষণ লক রাখার জন্য যাতে বারবার কাউন্ট না হয়

        // ক্যামেরা অন করার ফাংশন
        async function startVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                statusText.innerText = "ক্যামেরা চালু হয়েছে! AI মডেল এবং স্টাফের ফেস ডাটা লোড হচ্ছে...";
            } catch (err) {
                console.error("ক্যামেরা ত্রুটি: ", err);
                statusText.innerText = "ক্যামেরা পারমিশন পাওয়া যায়নি। ব্রাউজার সেটিংস চেক করুন।";
            }
        }

        // AI মডেল এবং স্টাফদের ফেস লোড করার ফাংশন
        async function loadModelsAndFaces() {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                
                statusText.innerText = "AI মডেল ডাউনলোড হচ্ছে...";
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmarkNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                statusText.innerText = "স্টাফদের ফেস ডাটা লোড করা হচ্ছে...";

                // ==========================================
                // এখানে আপনার স্টাফদের নাম এবং ImgBB বা ডাইরেক্ট ছবির লিংক দিন
                // ==========================================
                const labeledDescriptors = await Promise.all([
                    loadStaffFace("সুজিত মন্ডল", "https://i.ibb.co.com/example/sujit.jpg"), // 👈 আপনার বা স্টাফের ছবির লিংক দিন
                    loadStaffFace("অন্য স্টাফের নাম", "https://ibb.co/27gHYfpy") // 👈 প্রয়োজনমতো বাড়াতে পারেন
                ]);

                // ফেস ম্যাচার (টলারেন্স ০.৬ রাখা হয়েছে যাতে নিখুঁতভাবে ফেস ম্যাচ করে)
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
                
                isModelLoaded = true;
                statusText.className = "scanning";
                statusText.innerText = "সিস্টেম প্রস্তুত! ক্যামেরার সামনে এসে দাঁড়ান...";
                
                // মডেল লোড শেষ হলে অটোমেটিক রিয়েল-টাইম ডিটেকশন শুরু হবে
                startAutoDetection();

            } catch (error) {
                console.error("লোডিং ত্রুটি: ", error);
                statusText.innerText = "মডেল বা স্টাফের ছবি লোড করতে সমস্যা হয়েছে। ছবির লিংকগুলো চেক করুন।";
            }
        }

        // স্টাফের ছবি থেকে ফেস ফিচার রিড করার ফাংশন
        async function loadStaffFace(name, imageUrl) {
            const img = await faceapi.fetchImage(imageUrl);
            const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptor();
            
            if (!detection) {
                throw new Error(`${name} এর ছবিতে কোনো মুখ স্পষ্টভাবে পাওয়া যায়নি!`);
            }
            return new faceapi.LabeledFaceDescriptors(name, [detection.descriptor]);
        }

        // রিয়েল-টাইম অটোমেটিক ফেস ডিটেকশন লুপ
        function startAutoDetection() {
            // প্রতি ০.৫ সেকেন্ডে একবার ফেস স্ক্যান করবে (খুব দ্রুত কাজ করবে)
            setInterval(async () => {
                if (!isModelLoaded || !faceMatcher || isLocked) return;

                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (detection) {
                    const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

                    if (bestMatch.label !== "unknown") {
                        // মুখ মিলে গেছে!
                        let staffName = bestMatch.label;
                        confirmAttendance(staffName);
                    } else {
                        // অচেনা মুখ হলে
                        statusText.className = "scanning";
                        statusText.innerText = "অচেনা মুখ... রেজিস্টার্ড স্টাফ সামনে আসুন।";
                    }
                } else {
                    statusText.className = "scanning";
                    statusText.innerText = "ক্যামেরার সামনে মুখ নিয়ে আসুন...";
                }
            }, 500); 
        }

        // হাজিরা কনফার্ম এবং ভয়েস বলার ফাংশন
        function confirmAttendance(name) {
            isLocked = true; // বারবার হাজিরা নেওয়া সাময়িকভাবে বন্ধ রাখা হলো
            statusText.className = "success";
            statusText.innerText = `ধন্যবাদ, ${name}! আপনার হাজিরা কনফার্ম হয়েছে।`;

            // বাংলায় ভয়েস আউটপুট (অটোমেটিক কথা বলাবে)
            if ('speechSynthesis' in window) {
                const speechText = `ধন্যবাদ, ${name}, আপনার হাজিরা কনফার্ম হয়েছে।`;
                const utterance = new SpeechSynthesisUtterance(speechText);
                utterance.lang = 'bn-BD'; // বাংলা ভাষা সেট করা
                utterance.rate = 0.9;     // কথা বলার গতি স্বাভাবিক রাখা
                window.speechSynthesis.speak(utterance);
            }

            // যদি গুগল শিটে পাঠাতে চান, নিচের কোডের কমেন্ট (/* */) তুলে দিতে পারেন:
            /*
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ name: name, time: new Date().toLocaleString() })
            }).then(res => console.log("Google Sheet Updated"));
            */

            // ১৫ সেকেন্ড পর সিস্টেম আবার পরবর্তী স্টাফের জন্য রেডি হবে
            setTimeout(() => {
                isLocked = false;
                statusText.className = "scanning";
                statusText.innerText = "সিস্টেম প্রস্তুত! পরবর্তী স্টাফ আসুন...";
            }, 15000);
        }

        // ব্রাউজারে ভিডিও চালু হওয়ার সাথে সাথেই পুরো সিস্টেম রান হবে
        video.addEventListener('play', () => {
            loadModelsAndFaces();
        });

        startVideo();
    </script>
</body>
</html>
