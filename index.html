
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Staff Face Attendance System</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .nav-buttons { margin-bottom: 20px; }
        .nav-buttons button { padding: 10px 15px; margin: 5px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; background: #007bff; color: white; transition: 0.3s; }
        .nav-buttons button:hover { background: #0056b3; }
        .section { display: none; }
        .section.active { display: block; }
        video { width: 100%; max-width: 450px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: block; margin: 10px auto; }
        #status { font-size: 18px; font-weight: bold; margin-top: 15px; color: #007bff; min-height: 50px; }
        .success { color: #28a745 !important; background: #e8f5e9; padding: 10px; border-radius: 8px; font-size: 20px; }
        input, button.action-btn { width: 100%; padding: 10px; margin: 8px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button.action-btn { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button.action-btn:hover { background: #218838; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hotel Staff Face Attendance</h2>
        
        <div class="nav-buttons">
            <button onclick="switchTab('scanner')">📷 Attendance Scanner</button>
            <button onclick="switchTab('register')">➕ Staff Registration</button>
            <button onclick="switchTab('report')">📋 Attendance Report</button>
        </div>

        <!-- SECTION 1: SCANNER -->
        <div id="scanner-section" class="section active">
            <video id="video" autoplay muted playsinline></video>
            <div id="status">Starting camera... Please wait.</div>
        </div>

        <!-- SECTION 2: REGISTRATION -->
        <div id="register-section" class="section">
            <h3>Register New Staff</h3>
            <input type="text" id="staffName" placeholder="Enter Staff Full Name (e.g. Sujit Mandal)">
            <input type="file" id="staffPhotoInput" accept="image/*">
            <button class="action-btn" onclick="registerStaff()">💾 Save Staff</button>
            <div id="register-status" style="font-weight: bold; margin-top: 10px;"></div>
            <h4>Registered Staff List:</h4>
            <ul id="staffListUI" style="text-align: left; padding-left: 20px;"></ul>
        </div>

        <!-- SECTION 3: REPORT -->
        <div id="report-section" class="section">
            <h3>Attendance Log</h3>
            <button class="action-btn" style="background: #17a2b8;" onclick="downloadCSV()">📥 Download CSV Report</button>
            <table id="reportTable">
                <thead>
                    <tr>
                        <th>Staff Name</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const statusText = document.getElementById('status');
        
        let isModelLoaded = false;
        let faceMatcher = null;
        let registeredStaffs = JSON.parse(localStorage.getItem('hotel_staffs') || '[]');
        let attendanceLog = JSON.parse(localStorage.getItem('hotel_attendance') || '[]');
        let isLocked = false;

        function switchTab(tabName) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            if(tabName === 'scanner') document.getElementById('scanner-section').classList.add('active');
            if(tabName === 'register') {
                document.getElementById('register-section').classList.add('active');
                renderStaffList();
            }
            if(tabName === 'report') {
                document.getElementById('report-section').classList.add('active');
                renderReportTable();
            }
        }

        async function startVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                statusText.innerText = "Camera started! Loading AI models...";
            } catch (err) {
                statusText.innerText = "Camera permission denied or not available.";
            }
        }

        async function loadModels() {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmarkNet.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                isModelLoaded = true;
                statusText.innerText = "AI Models Loaded! Rebuilding Face Database...";
                await buildFaceMatcher();
                startAutoDetection();
            } catch (error) {
                statusText.innerText = "Error loading AI models. Please check internet.";
            }
        }

        async function buildFaceMatcher() {
            if (registeredStaffs.length === 0) {
                statusText.innerText = "No staff registered yet! Please go to 'Staff Registration'.";
                faceMatcher = null;
                return;
            }

            try {
                const labeledDescriptors = await Promise.all(
                    registeredStaffs.map(async staff => {
                        const img = await faceapi.fetchImage(staff.image);
                        const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                            .withFaceLandmarks()
                            .withFaceDescriptor();
                        return detection ? new faceapi.LabeledFaceDescriptors(staff.name, [detection.descriptor]) : null;
                    })
                );

                const validDescriptors = labeledDescriptors.filter(d => d !== null);
                if(validDescriptors.length > 0) {
                    faceMatcher = new faceapi.FaceMatcher(validDescriptors, 0.6);
                    statusText.innerText = "System Ready! Stand in front of the camera.";
                } else {
                    statusText.innerText = "Could not detect face in registered photos. Re-register staff.";
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function registerStaff() {
            const nameInput = document.getElementById('staffName');
            const photoInput = document.getElementById('staffPhotoInput');
            const regStatus = document.getElementById('register-status');
            
            if(!nameInput.value || photoInput.files.length === 0) {
                regStatus.style.color = "red";
                regStatus.innerText = "Please enter name and select an image file!";
                return;
            }

            regStatus.style.color = "#007bff";
            regStatus.innerText = "Processing staff photo...";

            const reader = new FileReader();
            reader.onload = async function(event) {
                const imgDataUrl = event.target.result;
                const img = await faceapi.fetchImage(imgDataUrl);
                const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if(!detection) {
                    regStatus.style.color = "red";
                    regStatus.innerText = "No face detected in the photo! Upload a clear front face photo.";
                    return;
                }

                registeredStaffs.push({ name: nameInput.value, image: imgDataUrl });
                localStorage.setItem('hotel_staffs', JSON.stringify(registeredStaffs));
                
                regStatus.style.color = "green";
                regStatus.innerText = "Staff registered successfully!";
                nameInput.value = "";
                photoInput.value = "";
                renderStaffList();
                if(isModelLoaded) buildFaceMatcher();
            }
            reader.readAsDataURL(photoInput.files[0]);
        }

        function renderStaffList() {
            const listUI = document.getElementById('staffListUI');
            listUI.innerHTML = "";
            registeredStaffs.forEach((staff, index) => {
                let li = document.createElement('li');
                li.innerHTML = `${staff.name} <button onclick="deleteStaff(${index})" style="color:red; margin-left:10px; cursor:pointer;">Delete</button>`;
                listUI.appendChild(li);
            });
        }

        function deleteStaff(index) {
            registeredStaffs.splice(index, 1);
            localStorage.setItem('hotel_staffs', JSON.stringify(registeredStaffs));
            renderStaffList();
            if(isModelLoaded) buildFaceMatcher();
        }

        function startAutoDetection() {
            setInterval(async () => {
                if (!isModelLoaded || !faceMatcher || isLocked) return;

                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (detection) {
                    const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

                    if (bestMatch.label !== "unknown") {
                        let staffName = bestMatch.label;
                        confirmAttendance(staffName);
                    } else {
                        statusText.style.color = "#e65100";
                        statusText.innerText = "Unknown face... Not registered.";
                    }
                } else {
                    statusText.style.color = "#007bff";
                    statusText.innerText = "Please stand in front of the camera...";
                }
            }, 800);
        }

        function confirmAttendance(name) {
            isLocked = true;
            statusText.className = "success";
            statusText.innerText = `Thank you, ${name}! Attendance Confirmed.`;

            // Hindi Voice Announcement
            if ('speechSynthesis' in window) {
                const speechText = `Dhanyavad ${name}, aapki haziri confirm ho gayi hai.`;
                const utterance = new SpeechSynthesisUtterance(speechText);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }

            // Save to log
            let currentTime = new Date().toLocaleString();
            attendanceLog.unshift({ name: name, time: currentTime });
            localStorage.setItem('hotel_attendance', JSON.stringify(attendanceLog));

            setTimeout(() => {
                isLocked = false;
                statusText.className = "";
                statusText.style.color = "#007bff";
                statusText.innerText = "System ready! Next staff please...";
            }, 12000);
        }

        function renderReportTable() {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = "";
            attendanceLog.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td>${item.name}</td><td>${item.time}</td>`;
                tbody.appendChild(tr);
            });
        }

        function downloadCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Staff Name,Date & Time\n";
            attendanceLog.forEach(row => {
                csvContent += `"${row.name}","${row.time}"\n`;
            });
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "attendance_report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        video.addEventListener('play', () => {
            loadModels();
        });

        startVideo();
    </script>
</body>
</html>
